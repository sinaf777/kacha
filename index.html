<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KachaPay – Authorization</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #120b06;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    body {
      padding: 16px;
    }

    .phone-frame {
      width: min(390px, 100vw);
      height: min(844px, calc(100vw * 844 / 390));
      background: linear-gradient(180deg, #180b03 0%, #1f1107 45%, #120b06 100%);
      border: 5px solid #ea580c;
      border-radius: 44px;
      box-shadow: 0 0 0 1px #7c2d12, 0 0 50px rgba(234,88,12,0.22), 0 30px 80px rgba(0,0,0,0.85);
      position: relative;
      overflow: hidden;
    }

    .screen {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 24px;
    }

    .auth-card {
      width: 100%;
      background: rgba(31, 17, 7, 0.92);
      border: 1px solid rgba(249, 115, 22, 0.4);
      border-radius: 28px;
      padding: 28px 22px 22px;
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.35);
      text-align: center;
    }

    .logo {
      width: 84px;
      height: 84px;
      border-radius: 50%;
      background: linear-gradient(135deg, #f97316, #ea580c);
      margin: 0 auto 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 28px rgba(234,88,12,0.4);
    }

    .title {
      font-size: 28px;
      font-weight: 800;
      color: #fff;
      letter-spacing: -0.03em;
      margin-bottom: 8px;
    }

    .subtitle {
      font-size: 14px;
      color: #fdba74;
      margin-bottom: 24px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .timer-box {
      background: rgba(234, 88, 12, 0.08);
      border: 1px solid rgba(249, 115, 22, 0.35);
      border-radius: 20px;
      padding: 18px 16px;
      margin-bottom: 22px;
    }

    .timer-label {
      font-size: 12px;
      color: #fdba74;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .timer {
      font-size: 40px;
      font-weight: 800;
      color: #fff;
      letter-spacing: 0.08em;
    }

    .info {
      font-size: 15px;
      color: #fed7aa;
      line-height: 1.6;
      margin-bottom: 22px;
    }

    .actions {
      display: flex;
      gap: 12px;
      flex-direction: column;
    }

    .btn {
      border: none;
      border-radius: 16px;
      padding: 16px 18px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.15s ease, opacity 0.15s ease;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .primary {
      background: linear-gradient(135deg, #ea580c, #f97316);
      color: #fff;
      box-shadow: 0 10px 24px rgba(234,88,12,0.35);
    }

    .secondary {
      background: transparent;
      color: #fdba74;
      border: 1px solid rgba(249,115,22,0.4);
    }
  </style>
</head>
<body>
  <div class="phone-frame">
    <div class="screen">
      <div class="auth-card">
        <div class="logo" aria-label="KachaPay logo">
          <svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
            <polyline points="2 17 12 22 22 17"></polyline>
            <polyline points="2 12 12 17 22 12"></polyline>
          </svg>
        </div>

        <div class="title">Please authorize</div>
        <div class="subtitle">Please wait...</div>

        <div class="timer-box">
          <div class="timer-label">Authorization expires in</div>
          <div class="timer" id="countdown">01:00:00</div>
        </div>

        <div class="info">Your transaction is waiting for approval. Please hold while we verify the request.</div>

        <div class="actions">
          <button class="btn primary">Authorize</button>
          <button class="btn secondary">Cancel</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const countdownEl = document.getElementById('countdown');
    const oneHourMs = 60 * 60 * 1000;
    const endTime = Date.now() + oneHourMs;

    function updateCountdown() {
      const remaining = Math.max(0, endTime - Date.now());
      const hours = String(Math.floor(remaining / (60 * 60 * 1000))).padStart(2, '0');
      const minutes = String(Math.floor((remaining % (60 * 60 * 1000)) / (60 * 1000))).padStart(2, '0');
      const seconds = String(Math.floor((remaining % (60 * 1000)) / 1000)).padStart(2, '0');
      countdownEl.textContent = `${hours}:${minutes}:${seconds}`;
    }

    updateCountdown();
    setInterval(updateCountdown, 1000);
  </script>
</body>
</html>
